[project]
name = "backend"
version = "0.1.0"
description = "Clinic Management API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "uvicorn[standard]>=0.29.0",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
